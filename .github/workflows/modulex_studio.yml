name: ModuleX Studio

# ModuleX Game Studio workspace (studio/). Fork-only; the upstream workflows are untouched.
#   linux   — lint, format, typecheck, build and unit tests of every workspace package, including the
#             compat.json parity test against the repo pins, and the multi-resolution icon check.
#   windows — unit tests on Windows, then the desktop shell: Tauri 2 + NSIS (unsigned) installer with the
#             bundled Node sidecar running the bundled Studio Core; silent install, then the installed app's
#             `--selftest` (sidecar handshake, authenticated /health, cold start + RSS), then silent uninstall.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: modulex-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Bundled sidecar runtime (Node LTS >= 22.14 is required by @baizor/gamedev-cli-core).
  SIDECAR_NODE_VERSION: "22.20.0"

jobs:
  linux:
    name: studio lint + typecheck + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Build godot-cli (workspace dependency file:../../cli)
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Install workspace
        working-directory: studio
        run: npm ci

      - name: Lint
        working-directory: studio
        run: npm run lint

      - name: Format check
        working-directory: studio
        run: npm run format:check

      - name: Build (shared -> core -> worker -> ui)
        working-directory: studio
        run: npm run build

      - name: Typecheck
        working-directory: studio
        run: npm run typecheck

      - name: Unit tests (includes compat.json parity with the repo pins)
        working-directory: studio
        run: npm test

      - name: Verify every icon PNG size + the multi-resolution Windows icon
        run: python3 studio/branding/render-icons.py --verify

      - name: Upload the Claude Desktop extension (.mcpb)
        uses: actions/upload-artifact@v6
        with:
          name: modulex-claude-desktop-extension
          path: studio/claude-desktop/dist/modulex-game-studio.mcpb
          if-no-files-found: error
          retention-days: 7

  windows:
    name: studio tests + Tauri NSIS installer (windows)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/app/src-tauri

      - name: Build godot-cli
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Install workspace + build packages
        working-directory: studio
        run: |
          npm ci
          npm run build

      - name: Unit tests on Windows
        working-directory: studio
        run: npm test

      - name: Fetch + verify the sidecar Node runtime (SHASUMS256, fail-closed)
        run: |
          $v = $env:SIDECAR_NODE_VERSION
          $zip = "node-v$v-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/v$v/$zip" -OutFile $zip
          Invoke-WebRequest "https://nodejs.org/dist/v$v/SHASUMS256.txt" -OutFile SHASUMS256.txt
          $expected = (Select-String -Path SHASUMS256.txt -Pattern " $([regex]::Escape($zip))$").Line.Split(' ')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $expected -ne $actual) { throw "node checksum mismatch ($actual vs $expected)" }
          Expand-Archive $zip -DestinationPath node-dist
          New-Item -ItemType Directory -Force studio/app/src-tauri/binaries | Out-Null
          Copy-Item "node-dist/node-v$v-win-x64/node.exe" "studio/app/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"
          Copy-Item "node-dist/node-v$v-win-x64/LICENSE" "studio/app/src-tauri/binaries/NODE_LICENSE.txt"

      - name: Prepare Authenticode signing (only when the owner's certificate secret exists)
        id: sign
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            "::notice::Code signing skipped: no WINDOWS_SIGNING_PFX_BASE64 secret. The installers are UNSIGNED and Windows SmartScreen will warn."
            "args=" >> $env:GITHUB_OUTPUT
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'modulex-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $script = (Resolve-Path studio/app/scripts/sign-windows.ps1).Path
          $cfg = Join-Path $env:RUNNER_TEMP 'tauri.sign.conf.json'
          @{ bundle = @{ windows = @{ signCommand = "pwsh -NoProfile -ExecutionPolicy Bypass -File $script %1" } } } |
            ConvertTo-Json -Depth 5 | Set-Content $cfg -Encoding utf8
          "args=--config $cfg" >> $env:GITHUB_OUTPUT
          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Build the NSIS installer (signed when a certificate is configured)
        working-directory: studio/app
        env:
          MODULEX_SIGN_PFX: ${{ runner.temp }}/modulex-sign.pfx
          MODULEX_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: npx tauri build --bundles nsis ${{ steps.sign.outputs.args }}

      - name: Locate the installer
        id: installer
        run: |
          $exe = Get-ChildItem studio/app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer produced" }
          # Shipped name (Execution Patch 1 §7): the small bootstrapper installer. Heavy components (Godot,
          # export templates, .NET SDK, JDK, Android SDK) are installed on demand by the Setup Assistant.
          $named = Join-Path $exe.DirectoryName 'ModuleXGameStudioSetup.exe'
          Move-Item $exe.FullName $named -Force
          $exe = Get-Item $named
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "Installer: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"

      - name: Silent install, self-test, silent uninstall
        run: |
          $setup = "${{ steps.installer.outputs.path }}"
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter 'ModuleX Game Studio.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "installed app not found under LOCALAPPDATA" }
          "Installed at: $($app.DirectoryName)"
          Get-ChildItem $app.DirectoryName -Recurse | Select-Object -ExpandProperty FullName
          # Phase 14: the licence texts ship with the app.
          foreach ($l in @('LICENSE.txt', 'THIRD_PARTY_LICENSES.md', 'NODE_LICENSE.txt')) {
            $f = Get-ChildItem $app.DirectoryName -Recurse -Filter $l | Select-Object -First 1
            if (-not $f) { throw "licence file $l is not installed" }
          }
          $report = Join-Path $env:RUNNER_TEMP 'modulex-selftest.json'
          $t = Start-Process $app.FullName -ArgumentList '--selftest', $report -Wait -PassThru
          Get-Content $report
          if ($t.ExitCode -ne 0) { throw "self-test failed (exit $($t.ExitCode))" }
          # The small installer bundles no engine: Core must honestly report the pipeline as unavailable.
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $h = $r.health_body
          if ($h.pipeline.available -ne $false) { throw "small installer: pipeline.available should be false (no Godot bundled)" }
          # D-056: Core stored, read back and deleted a probe secret in Windows Credential Manager through the shell.
          if ($r.vault_ok -ne $true) { throw "credential store bridge round-trip failed: $($r.vault_detail | ConvertTo-Json -Compress)" }
          Copy-Item $report modulex-selftest.json
          $uninstaller = Get-ChildItem $app.DirectoryName -Filter 'uninstall*.exe' | Select-Object -First 1
          if ($uninstaller) {
            $u = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            "uninstaller exit code: $($u.ExitCode)"
          }

      - name: Fetch + verify Godot 4.5.1 .NET and the MCP server for the full installer (fail-closed)
        run: |
          $godotZip = "Godot_v4.5.1-stable_mono_win64.zip"
          $base = "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable"
          Invoke-WebRequest "$base/$godotZip" -OutFile $godotZip
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile SHA512-SUMS.txt
          $expected = (Select-String -Path SHA512-SUMS.txt -Pattern "  $([regex]::Escape($godotZip))$").Line.Split(' ')[0]
          $actual = (Get-FileHash $godotZip -Algorithm SHA512).Hash.ToLower()
          if (-not $expected -or $expected -ne $actual) { throw "Godot checksum mismatch ($actual vs $expected)" }
          Expand-Archive $godotZip -DestinationPath godot-dist
          $engine = "studio/app/src-tauri/engine"
          New-Item -ItemType Directory -Force "$engine/godot", "$engine/server" | Out-Null
          Copy-Item "godot-dist/Godot_v4.5.1-stable_mono_win64/*" "$engine/godot/" -Recurse
          $v = "9.2.9"
          $srvZip = "gamedev-mcp-server-win-x64.zip"
          $sbase = "https://github.com/IvanMurzak/GameDev-MCP-Server/releases/download/v$v"
          Invoke-WebRequest "$sbase/$srvZip" -OutFile $srvZip
          Invoke-WebRequest "$sbase/SHA256SUMS" -OutFile SHA256SUMS
          $sexp = (Select-String -Path SHA256SUMS -Pattern " $([regex]::Escape($srvZip))$").Line.Split(' ')[0]
          $sact = (Get-FileHash $srvZip -Algorithm SHA256).Hash.ToLower()
          if (-not $sexp -or $sexp -ne $sact) { throw "server checksum mismatch ($sact vs $sexp)" }
          Expand-Archive $srvZip -DestinationPath server-dist
          $bin = Get-ChildItem server-dist -Recurse -Filter 'gamedev-mcp-server.exe' | Select-Object -First 1
          if (-not $bin) { throw "server exe not found in $srvZip" }
          Copy-Item "$($bin.DirectoryName)/*" "$engine/server/" -Recurse
          Get-ChildItem $engine -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "engine payload: $([math]::Round($_.Sum / 1MB, 1)) MB" }

      - name: Build the full installer (Godot 4.5.1 .NET + MCP server bundled)
        id: full
        working-directory: studio/app
        env:
          MODULEX_SIGN_PFX: ${{ runner.temp }}/modulex-sign.pfx
          MODULEX_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          npx tauri build --bundles nsis --config src-tauri/tauri.full.conf.json ${{ steps.sign.outputs.args }}
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Where-Object { $_.Name -notlike 'ModuleXGameStudio*' } | Select-Object -First 1
          if (-not $exe) { throw "no full installer produced" }
          $named = Join-Path $exe.DirectoryName 'ModuleXGameStudioFullSetup.exe'
          Move-Item $exe.FullName $named -Force
          $size = (Get-Item $named).Length
          "Full installer: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 100MB) { throw "full installer is unexpectedly small ($size bytes): the engine was not bundled" }

      - name: Full installer — silent install, self-test (pipeline available), silent uninstall
        run: |
          $setup = "studio/app/src-tauri/target/release/bundle/nsis/ModuleXGameStudioFullSetup.exe"
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "full installer exit code $($p.ExitCode)" }
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter 'ModuleX Game Studio.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "installed app not found under LOCALAPPDATA" }
          "Installed at: $($app.DirectoryName)"
          $godot = Get-ChildItem $app.DirectoryName -Recurse -Filter 'Godot_v4.5.1-stable_mono_win64.exe' | Select-Object -First 1
          $server = Get-ChildItem $app.DirectoryName -Recurse -Filter 'gamedev-mcp-server.exe' | Select-Object -First 1
          if (-not $godot) { throw "bundled Godot 4.5.1 .NET not installed" }
          if (-not $server) { throw "bundled gamedev-mcp-server not installed" }
          "Godot:  $($godot.FullName)"
          "Server: $($server.FullName)"
          $report = Join-Path $env:RUNNER_TEMP 'modulex-selftest-full.json'
          $t = Start-Process $app.FullName -ArgumentList '--selftest', $report -Wait -PassThru
          Get-Content $report
          if ($t.ExitCode -ne 0) { throw "full self-test failed (exit $($t.ExitCode))" }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $h = $r.health_body
          if ($r.vault_ok -ne $true) { throw "full installer: credential store bridge round-trip failed" }
          # MODULEX_GODOT + MODULEX_ADDONS_SOURCE + MODULEX_PROJECTS_ROOT resolved → the pipeline executes;
          # MODULEX_SERVER resolved → the scripted QA tier is wired.
          if ($h.pipeline.available -ne $true) { throw "full installer: Core reports the pipeline as unavailable (MODULEX_GODOT not resolved)" }
          if ($h.pipeline.qaTier -ne $true) { throw "full installer: Core reports no QA tier (MODULEX_SERVER not resolved)" }
          "pipeline.available=$($h.pipeline.available) pipeline.qaTier=$($h.pipeline.qaTier)"
          Copy-Item $report modulex-selftest-full.json
          $uninstaller = Get-ChildItem $app.DirectoryName -Filter 'uninstall*.exe' | Select-Object -First 1
          if ($uninstaller) {
            $u = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            "uninstaller exit code: $($u.ExitCode)"
          }

      - name: Authenticode status of both installers
        run: |
          foreach ($f in @('ModuleXGameStudioSetup.exe', 'ModuleXGameStudioFullSetup.exe')) {
            $p = "studio/app/src-tauri/target/release/bundle/nsis/$f"
            if (-not (Test-Path $p)) { continue }
            $sig = Get-AuthenticodeSignature $p
            "$f : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ('${{ steps.sign.outputs.enabled }}' -eq 'true' -and $sig.Status -ne 'Valid') { throw "$f is not validly signed" }
          }
          if ('${{ steps.sign.outputs.enabled }}' -ne 'true') { "UNSIGNED build (no certificate secret): SmartScreen will warn on first run." }

      - name: Upload the full installer
        uses: actions/upload-artifact@v6
        with:
          name: modulex-studio-windows-full
          path: studio/app/src-tauri/target/release/bundle/nsis/ModuleXGameStudioFullSetup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload installer + self-test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: modulex-studio-windows
          path: |
            studio/app/src-tauri/target/release/bundle/nsis/ModuleXGameStudioSetup.exe
            modulex-selftest.json
            modulex-selftest-full.json
          if-no-files-found: warn
          retention-days: 7
