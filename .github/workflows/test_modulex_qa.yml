name: Test ModuleX QA (live)

# Live end-to-end gate for the ModuleX Studio addon (addons/modulex_studio/). Boots a REAL Godot 4.5.1 mono
# editor + game against REAL gamedev-mcp-server instances in token mode and drives the project-* and game-*
# tools exactly the way ModuleX Game Studio will (scripts/modulex_qa_harness.py). Fork-only; the upstream
# workflows are untouched. The game leg renders (game-screenshot needs pixels), so it runs under Xvfb with
# Mesa's software OpenGL (llvmpipe).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: modulex-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modulex-qa:
    name: modulex QA harness (Godot 4.5.1 mono)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.5.1"
      TEST_PROJECT: Godot-Tests-Modulex
      # Must equal ServerVersion in addons/godot_mcp/Runtime/Connection/GodotMcpServerView.cs (studio/compat.json
      # parity test enforces the same pin).
      SERVER_VERSION: "9.2.9"
      SERVER_ASSET: gamedev-mcp-server-linux-x64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Xvfb + Mesa (software OpenGL for the rendering game leg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null

      - name: Setup Godot ${{ env.GODOT_VERSION }} (mono)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: false

      - name: Report Godot version
        run: godot --version --headless

      - name: Download + verify gamedev-mcp-server (SHA256SUMS, fail-closed)
        id: server
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/IvanMurzak/GameDev-MCP-Server/releases/download/v${SERVER_VERSION}"
          mkdir -p server
          curl -fsSL -o "server/${SERVER_ASSET}" "${base}/${SERVER_ASSET}"
          curl -fsSL -o server/SHA256SUMS "${base}/SHA256SUMS"
          (cd server && grep " ${SERVER_ASSET}\$" SHA256SUMS | sha256sum -c -)
          unzip -o -q "server/${SERVER_ASSET}" -d server/bin
          bin="$(find server/bin -type f -name gamedev-mcp-server | head -n1)"
          chmod +x "$bin"
          echo "bin=$(pwd)/$bin" >> "$GITHUB_OUTPUT"

      - name: Copy both addons into the testbed
        run: |
          set -euo pipefail
          rm -rf "${TEST_PROJECT}/addons"
          mkdir -p "${TEST_PROJECT}/addons"
          cp -r addons/godot_mcp addons/modulex_studio "${TEST_PROJECT}/addons/"

      - name: Import (materialize .godot/)
        run: godot --headless --path "${TEST_PROJECT}" --import --quit 2>&1 | tee import.log || true

      - name: Build C# (both addons + testbed into one assembly)
        run: dotnet build "${TEST_PROJECT}/${TEST_PROJECT}.csproj" --configuration Debug 2>&1 | tee build.log

      - name: Run the live harness (editor leg + rendering playtest leg)
        env:
          SERVER_BIN: ${{ steps.server.outputs.bin }}
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            python scripts/modulex_qa_harness.py \
              --godot "$(command -v godot)" \
              --server "${SERVER_BIN}" \
              --project "${TEST_PROJECT}" \
              --result modulex-qa-result.json \
              --workdir modulex-qa-work

      - name: Setup Node (Studio Core live gate)
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: GATE 4 — Studio Core against the real editor (supervisors, GodotCall, checkpoints, crash restart)
        env:
          MODULEX_LIVE_SERVER: ${{ steps.server.outputs.bin }}
        run: |
          set -euo pipefail
          (cd cli && npm ci && npm run build)
          (cd studio && npm ci && npm run build -w @modulex/shared)
          export MODULEX_LIVE_GODOT="$(readlink -f "$(command -v godot)")"
          export MODULEX_LIVE_PROJECT="$(pwd)/${TEST_PROJECT}"
          cd studio/core
          npx vitest run --reporter=verbose tests/live-godot.test.ts tests/foundation.test.ts 2>&1 | tee ../../gate4.log
          # The live suite must actually have run (never a silent skip in this job).
          grep -q "scene-create → node-create → scene-save" ../../gate4.log
          # The "not exercised" placeholder is listed as skipped (↓) when the live suite runs; fail only if it PASSED.
          if grep -E "✓.*not exercised" ../../gate4.log; then echo "GATE 4 was skipped" >&2; exit 1; fi

      - name: GATE 8 — import a generated GLB into the real editor (windowed under Xvfb, thumbnail rendered)
        env:
          MODULEX_LIVE_SERVER: ${{ steps.server.outputs.bin }}
        run: |
          set -euo pipefail
          export MODULEX_LIVE_GODOT="$(readlink -f "$(command -v godot)")"
          export MODULEX_LIVE_PROJECT="$(pwd)/${TEST_PROJECT}"
          cd studio/core
          xvfb-run -a -s "-screen 0 1600x1000x24" npx vitest run --reporter=verbose tests/live-import.test.ts tests/assets.test.ts 2>&1 | tee ../../gate8.log
          grep -q "live import: exercised" ../../gate8.log
          grep -q "luminance variance" ../../gate8.log

      - name: GATE 9 — QA runner, injected bugs and the fix loop (windowed under Xvfb)
        env:
          MODULEX_LIVE_SERVER: ${{ steps.server.outputs.bin }}
        run: |
          set -euo pipefail
          export MODULEX_LIVE_GODOT="$(readlink -f "$(command -v godot)")"
          cd studio/core
          xvfb-run -a -s "-screen 0 1600x1000x24" npx vitest run --reporter=verbose tests/live-qa.test.ts tests/qa.test.ts 2>&1 | tee ../../gate9.log
          # The live suite must actually have run (never a silent skip in this job).
          grep -q "unfixable bug BLOCKED: exercised" ../../gate9.log

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: modulex-qa-evidence
          # Server logs (*.private.log) echo the session token and are deliberately NOT uploaded.
          path: |
            modulex-qa-result.json
            modulex-qa-work/editor.log
            modulex-qa-work/game.log
            modulex-qa-work/game-screenshot.png
            import.log
            build.log
            gate4.log
            gate8.log
            gate9.log
          if-no-files-found: ignore
          retention-days: 7

  studio-pipeline:
    # GATE 6/10: SAMPLE_GAME_SPEC → studio_game_create → the real pipeline engine (project creation, import,
    # dotnet build, every scene headless, static QA, Windows QA build, Windows RELEASE / iOS PREPARED / Android
    # BLOCKED exports). Needs the export templates, so it is a separate job from the harness above.
    name: Studio pipeline — Game Specification to builds (Godot 4.5.1 mono)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.5.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Setup Godot ${{ env.GODOT_VERSION }} (mono, with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: GATE 6 — creation pipeline end to end
        run: |
          set -euo pipefail
          (cd cli && npm ci && npm run build)
          (cd studio && npm ci && npm run build -w @modulex/shared)
          export MODULEX_LIVE_GODOT="$(readlink -f "$(command -v godot)")"
          export MODULEX_LIVE_PROJECTS_ROOT="$(pwd)/gate6-games"
          mkdir -p "$MODULEX_LIVE_PROJECTS_ROOT"
          cd studio/core
          npx vitest run --reporter=verbose tests/live-pipeline.test.ts 2>&1 | tee ../../gate6.log
          grep -q "Windows QA + RELEASE builds: exercised" ../../gate6.log

      - name: Upload the generated sample game (Windows RELEASE build)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: sample-game-space-kid-journey-windows
          path: gate6-games/space-kid-journey/build-output/0.1.0/windows-release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GATE 6 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-pipeline-evidence
          path: |
            gate6.log
            gate6-games/space-kid-journey/build-output/0.1.0/logs/
          if-no-files-found: ignore
          retention-days: 7

  windows-smoke:
    # GATE 10 on a real Windows host: SAMPLE_GAME_SPEC → project → Windows QA + RELEASE exports, then the QA build
    # runs every default scenario through its in-game QA runtime and the RELEASE build (no MCP inside) must stay
    # alive for 10 s. Windowed first; a runner with no usable display/GPU falls back to MODULEX_SMOKE_HEADLESS=1,
    # and the log says so explicitly.
    name: Windows smoke — exported QA + RELEASE builds (Godot 4.5.1 mono)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.5.1"
      # Must equal ServerVersion in addons/godot_mcp/Runtime/Connection/GodotMcpServerView.cs.
      SERVER_VERSION: "9.2.9"
      SERVER_ASSET: gamedev-mcp-server-win-x64.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Setup Godot ${{ env.GODOT_VERSION }} (mono, with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Report Godot version
        run: godot --version --headless

      - name: Download + verify gamedev-mcp-server win-x64 (SHA256SUMS, fail-closed)
        id: server
        run: |
          set -euo pipefail
          base="https://github.com/IvanMurzak/GameDev-MCP-Server/releases/download/v${SERVER_VERSION}"
          mkdir -p server
          curl -fsSL -o "server/${SERVER_ASSET}" "${base}/${SERVER_ASSET}"
          curl -fsSL -o server/SHA256SUMS "${base}/SHA256SUMS"
          (cd server && grep " ${SERVER_ASSET}\$" SHA256SUMS | sha256sum -c -)
          unzip -o -q "server/${SERVER_ASSET}" -d server/bin
          bin="$(find server/bin -type f -name gamedev-mcp-server.exe | head -n1)"
          echo "bin=$(cygpath -w "$(pwd)/$bin")" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Build the workspace
        run: |
          set -euo pipefail
          (cd cli && npm ci && npm run build)
          (cd studio && npm ci && npm run build -w @modulex/shared)

      - name: Setup Assistant — live official sources (Godot, MCP server, .NET 8 SDK, Git; checksum-verified)
        run: |
          set -euo pipefail
          cd studio/core
          MODULEX_LIVE_SETUP=1 MODULEX_LIVE_SETUP_COMPONENTS=godot-mono,mcp-server,dotnet-sdk,git \
            npx vitest run --reporter=verbose tests/setup-live.test.ts 2>&1 | tee ../../setup-live.log
          grep -q "official sources: exercised" ../../setup-live.log

      - name: GATE 10 — Windows export + smoke (windowed, headless fallback)
        env:
          MODULEX_LIVE_SERVER: ${{ steps.server.outputs.bin }}
        run: |
          # The default Actions bash runs with -e; the windowed attempt may fail and must fall through to the retry.
          set +e
          set -uo pipefail
          # setup-godot puts a symlink shim (~/bin/godot, no .exe) on PATH, which Git Bash cannot resolve and which
          # Node cannot spawn reliably. Use the real executable from setup-godot's install folder; fail if absent.
          home_unix="$(cygpath -u "${USERPROFILE}")"
          real="$(find "${home_unix}/godot" "${home_unix}/bin" -maxdepth 4 -iname 'Godot_v*_mono_win64.exe' ! -iname '*console*' 2>/dev/null | head -n1)"
          if [ -z "$real" ]; then
            echo "::error::Godot .exe not found under ${home_unix}/godot"; find "${home_unix}/godot" -maxdepth 3 2>/dev/null | head -50; exit 1
          fi
          export MODULEX_LIVE_GODOT="$(cygpath -w "$real")"
          echo "MODULEX_LIVE_GODOT=${MODULEX_LIVE_GODOT}"
          export MODULEX_LIVE_PROJECTS_ROOT="$(cygpath -w "$(pwd)/gate10-games")"
          mkdir -p gate10-games
          cd studio/core
          npx vitest run --reporter=verbose tests/live-windows-smoke.test.ts 2>&1 | tee ../../gate10.log
          if grep -q "Windows QA + RELEASE smoke: exercised" ../../gate10.log; then exit 0; fi
          echo "::warning::GATE 10 windowed run failed on this runner; retrying with MODULEX_SMOKE_HEADLESS=1 (no window verified)."
          echo "[gate10] windowed run FAILED on the runner; retrying headless (MODULEX_SMOKE_HEADLESS=1)" | tee -a ../../gate10.log
          rm -rf ../../gate10-games && mkdir -p ../../gate10-games
          MODULEX_SMOKE_HEADLESS=1 npx vitest run --reporter=verbose tests/live-windows-smoke.test.ts 2>&1 | tee -a ../../gate10.log
          grep -q "Windows QA + RELEASE smoke: exercised" ../../gate10.log

      - name: Upload GATE 10 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-smoke-evidence
          path: |
            gate10.log
            setup-live.log
            gate10-games/space-kid-journey/build-output/0.1.0/logs/
          if-no-files-found: ignore
          retention-days: 7
