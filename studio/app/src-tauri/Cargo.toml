[package]
name = "modulex-game-studio"
version = "0.1.0"
description = "ModuleX Game Studio desktop shell"
authors = ["ModuleX"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "modulex_game_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# Windows Credential Manager (DPAPI) for long-lived Studio credentials; see src/credentials.rs.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
